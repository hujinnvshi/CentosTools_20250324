systemLog:
  destination: file
  path: "/data/mongo_cluster_7.0.12/logs/config1.log"
  logAppend: true
  verbosity: 0  # 适当提高日志级别以便监控
  timeStampFormat: iso8601-utc  # 使用UTC时间格式

storage:
  dbPath: "/data/mongo_cluster_7.0.12/data/config1"
  engine: wiredTiger
  wiredTiger:
    engineConfig:
      cacheSizeGB: 16  # 配置服务器需要较少内存（128GB的12.5%）
      journalCompressor: snappy
    indexConfig:
      prefixCompression: true

net:
  bindIp: 0.0.0.0
  port: 27119
  maxIncomingConnections: 10000  # 增加连接数支持更多mongos连接
  wireObjectCheck: false  # 禁用BSON验证提高性能
  compression:
    compressors: snappy,zstd  # 启用网络压缩

replication:
  replSetName: configRepl
  oplogSizeMB: 10240  # 配置服务器oplog可以适当减小
  enableMajorityReadConcern: true

sharding:
  clusterRole: configsvr

security:
  keyFile: "/data/mongo_cluster_7.0.12/keyfile"
  javascriptEnabled: false  # 禁用JavaScript减少安全风险

operationProfiling:
  mode: slowOp  # 仅记录慢操作
  slowOpThresholdMs: 50  # 更低的慢操作阈值
  rateLimit: 100  # 限制采样率

setParameter:
  # 连接池优化
  connPoolMaxConnsPerHost: 100
  connPoolMaxShardedConnsPerHost: 100
  connPoolMaxInUseConnsPerHost: 50
  
  # 查询优化
  internalQueryExecMaxBlockingSortBytes: 33554432  # 32MB
  internalQueryMaxBlockingSortMemoryUsageBytes: 67108864  # 64MB
  
  # 线程优化
  net.serviceExecutor: "synchronous"
  net.serviceExecutorThreads: 16  # 配置服务器需要处理元数据请求
  
  # 配置服务器专用优化
  configsvrCommitIntervalMs: 500  # 降低元数据提交间隔
  configsvrMode: "sccc"  # 单节点配置服务器模式（测试环境）
  configsvrShardCollection: true  # 启用分片集合优化
  
  # 诊断配置
  diagnosticDataCollectionEnabled: true
  logLevel: 1
  enableFlowControl: true
  flowControlTargetLagSeconds: 2  # 更严格的控制延迟

