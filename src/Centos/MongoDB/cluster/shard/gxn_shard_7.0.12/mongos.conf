systemLog:
  destination: file
  path: "/data/mongo_cluster_7.0.12/logs/mongos.log"
  logAppend: true
  verbosity: 1  # 适当提高日志级别以便监控
  # traceExceptions: false  # 禁用异常跟踪减少日志量
  timeStampFormat: iso8601-utc  # 使用UTC时间格式
  component:
    query: { verbosity: 1 }  # 详细记录查询日志
    sharding: { verbosity: 1 }  # 详细记录分片操作

net:
  bindIp: 0.0.0.0
  port: 27117
  maxIncomingConnections: 50000  # 大幅增加最大连接数
  wireObjectCheck: false  # 禁用BSON验证提高性能
  compression:
    compressors: snappy,zstd  # 启用网络压缩
  ipv6: false  # 禁用IPv6减少资源消耗

sharding:
  configDB: configRepl/127.0.0.1:27119
  # autoSplit: true  # 启用自动分块
  # balancer:
    # stopped: false  # 启用平衡器
    # mode: "full"  # 全速平衡模式
    # activeWindow:  # 24小时运行平衡器
      # start: "00:00"
      # stop: "23:59"
    # migrationWriteConcern:  # 平衡器写关注
      # w: 1
      # j: false
    # maxConcurrentCollections: 5  # 增加并发迁移集合数
    # maxConcurrentChunkMigration: 10  # 增加并发迁移块数

security:
  keyFile: "/data/mongo_cluster_7.0.12/keyfile"
  javascriptEnabled: false  # 禁用JavaScript减少安全风险

operationProfiling:
  # mode: slowOp  # 仅记录慢操作
  slowOpThresholdMs: 50  # 更低的慢操作阈值
  # rateLimit: 100  # 限制采样率

setParameter:
  # 连接池优化
  connPoolMaxConnsPerHost: 500  # 增加每个分片的连接数
  # connPoolMaxShardedConnsPerHost: 500
  connPoolMaxInUseConnsPerHost: 300
  # shardedConnPoolIdleTimeoutMinutes: 5  # 空闲连接超时
  # shardedConnPoolMinConnsPerHost: 50  # 最小保持连接数
  
  # 查询路由优化
  queryAnalysisWriterIntervalSecs: 5  # 降低查询分析间隔
  maxTimeMSForHedgedReads: 10000  # 增加对冲读超时
  # maxQueryExecutionTimeMS: 30000  # 增加最大查询执行时间
  notablescan: false  # 允许全表扫描（测试环境）
  
  # 线程优化
  # net.serviceExecutor: "synchronous"
  # net.serviceExecutorThreads: 48  # 使用所有CPU核心
  # taskExecutorPoolSize: 48  # 任务执行线程数
  
  # 分片操作优化
  # shardingConcurrency: 16  # 增加分片操作并发度
  # migrationLockAcquisitionMaxWaitMS: 5000  # 减少迁移锁等待时间
  # balancerMigrationsThrottlingMs: 100  # 降低迁移延迟
  
  # 诊断配置
  diagnosticDataCollectionEnabled: true
  logLevel: 1
  enableFlowControl: true
  flowControlTargetLagSeconds: 5
  
  # 缓存优化
  # queryCacheSize: 268435456  # 256MB查询缓存
  # shardedIndexConsistencyCheckIntervalMS: 60000  # 减少索引一致性检查间隔
  
  # 元数据刷新优化
  # clusterAuthMode: "keyFile"
  # configServerRefreshIntervalSecs: 5  # 降低元数据刷新间隔
  maxSessions: 100000  # 增加最大会话数

