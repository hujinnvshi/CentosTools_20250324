systemLog:
  destination: file
  path: "/data/mongo_cluster_7.0.12/logs/shard1.log"
  logAppend: true
  verbosity: 0  # 适当提高日志级别以便监控
  # traceExceptions: false  # 禁用异常跟踪减少日志量
  timeStampFormat: iso8601-utc  # 使用UTC时间格式

storage:
  dbPath: "/data/mongo_cluster_7.0.12/data/shard1"
  #journal:
  #  enabled: true
  #  commitIntervalMs: 100  # 降低提交间隔提高写入性能
  engine: wiredTiger
  wiredTiger:
    engineConfig:
      cacheSizeGB: 64  # 使用50%系统内存 (128GB * 0.5 = 64GB)
      journalCompressor: snappy  # 使用snappy压缩日志
      maxCacheOverflowFileSizeGB: 10  # 增加溢出文件大小
      # eviction_target: 80  # 优化缓存淘汰策略
      # eviction_trigger: 95
      # eviction_dirty_target: 5
      # eviction_dirty_trigger: 20
      # backgroundThreads: 8  # 增加后台线程数
    collectionConfig:
      blockCompressor: zstd  # 使用zstd获得更好的压缩比
    indexConfig:
      prefixCompression: true  # 启用索引前缀压缩

net:
  bindIp: 0.0.0.0
  port: 27118
  maxIncomingConnections: 20000  # 大幅增加最大连接数
  wireObjectCheck: false  # 禁用BSON验证提高性能
  compression:
    compressors: snappy,zstd  # 启用网络压缩

replication:
  replSetName: shard1Repl
  oplogSizeMB: 20480  # 增加oplog大小
  enableMajorityReadConcern: true  # 启用多数读关注

sharding:
  clusterRole: shardsvr

security:
  keyFile: "/data/mongo_cluster_7.0.12/keyfile"
  javascriptEnabled: false  # 禁用JavaScript减少安全风险

operationProfiling:
  mode: slowOp  # 仅记录慢操作
  slowOpThresholdMs: 100  # 降低慢操作阈值
  # rateLimit: 100  # 限制采样率

setParameter:
  # 连接池优化
  connPoolMaxConnsPerHost: 200
  # connPoolMaxShardedConnsPerHost: 200
  connPoolMaxInUseConnsPerHost: 100
  
  # 查询优化
  # internalQueryExecMaxBlockingSortBytes: 67108864  # 64MB
  internalQueryMaxBlockingSortMemoryUsageBytes: 134217728  # 128MB
  notablescan: false  # 生产环境建议设为true
  
  # 写入优化
  # bulkWriteBatchSize: 1000
  # maxWriteBatchSize: 100000
  
  # 线程优化
  # net.serviceExecutor: "synchronous"
  # net.serviceExecutorThreads: 32  # 根据核心数设置
  
  # 诊断配置
  diagnosticDataCollectionEnabled: true
  logLevel: 1
  enableFlowControl: true
  flowControlTargetLagSeconds: 5
  
  # 复制集优化
  # replicationTimeoutSecs: 10
  # heartbeatIntervalMillis: 2000
  # electionTimeoutMillis: 10000
