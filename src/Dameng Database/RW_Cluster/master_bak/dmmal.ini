MAL_CHECK_INTERVAL = 5     # MAL 链路检测时间间隔
MAL_CONN_FAIL_INTERVAL = 5 # 判定 MAL 链路断开的时间

[MAL_INST1]
MAL_INST_NAME = RWC1         # 实例名，和 dm.ini 中的 INSTANCE_NAME 一致
MAL_HOST = 172.16.49.36      # MAL 系统监听 TCP 连接的 IP 地址
MAL_PORT = 61141             # MAL 系统监听 TCP 连接的端口
MAL_INST_HOST = 172.16.48.36 # 实例的对外服务 IP 地址
MAL_INST_PORT = 7102         # 实例的对外服务端口，和 dm.ini 中的 PORT_NUM 一致
MAL_DW_PORT = 52141          # 实例本地的守护进程监听 TCP 连接的端口
MAL_INST_DW_PORT = 33141     # 实例监听守护进程 TCP 连接的端口

[MAL_INST2]
MAL_INST_NAME = RWC2
MAL_HOST = 172.16.49.39
MAL_PORT = 61142
MAL_INST_HOST = 172.16.48.39
MAL_INST_PORT = 7102
MAL_DW_PORT = 52142
